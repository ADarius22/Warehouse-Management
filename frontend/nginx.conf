# nginx serves the built Angular app and forwards API calls to the backend container,
# so the browser only ever talks to one origin (no CORS needed) - same idea as proxy.conf.json in development.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # REST API and API docs -> Spring Boot ("backend" is the service name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Angular routes (/orders/3, /login...) are handled in the browser: always return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built files have content hashes in their names, so they can be cached for a long time
    location ~* \.(js|css|woff2?|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
