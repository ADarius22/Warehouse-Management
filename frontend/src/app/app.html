@if (auth.user(); as user) {
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span>Warehouse<br /><small>Management System</small></span>
      </div>
      <nav class="nav">
        @for (link of links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="active">
            <span class="nav-icon" aria-hidden="true">{{ link.icon }}</span>{{ link.label }}
          </a>
        }
      </nav>
      <div class="user-box">
        <div>
          <div class="user-name">{{ user.username }}</div>
          <div class="user-role">{{ user.roles.join(', ') }}</div>
        </div>
        <button class="link-btn" (click)="auth.logout()">Log out</button>
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}

<app-toasts />
